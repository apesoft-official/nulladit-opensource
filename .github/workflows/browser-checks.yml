name: Browser build and local tools checks
on:
  push:
    branches: [preview/functional-interface]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/local-tools.test.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1 ethers@6.15.0
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run preview -- --port 4173 > /tmp/nulladit-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node tests/browser-wallet-smoke.mjs
