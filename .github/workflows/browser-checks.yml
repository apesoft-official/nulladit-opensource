name: Browser build and local tools checks
on:
  push:
    branches: [preview/functional-interface]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/local-tools.test.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1 ethers@6.15.0
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run preview -- --port 4173 > /tmp/nulladit-preview.log 2>&1 &
          npm run preview -- --port 8765 > /tmp/nulladit-local-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          NULLADIT_TEST_WALLET=metamask node tests/browser-wallet-smoke.mjs
          NULLADIT_TEST_WALLET=coinbase node tests/browser-wallet-smoke.mjs
          NULLADIT_TEST_WALLET=metamask node tests/browser-wallet-startup-smoke.mjs
          NULLADIT_TEST_WALLET=coinbase node tests/browser-wallet-startup-smoke.mjs
      - name: Package tested public website
        run: |
          test -f dist/index.html
          cd dist
          zip -qr ../nulladit-web-deploy.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: nulladit-web-deploy
          path: nulladit-web-deploy.zip
          if-no-files-found: error
